name: Build Amoechat Manual Deployment Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amoechat-manual-build
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.9.0"
  DEFAULT_SITE_URL: "https://blog.amoechat.com"

jobs:
  build-package:
    name: Build standalone package
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build production standalone
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || env.DEFAULT_SITE_URL }}
          # Single-server deployment: Next.js membuat dan menyematkan key
          # Server Actions ke build secara otomatis.
          DATABASE_URL: mysql://build:build@127.0.0.1:3306/amoechat_build

      - name: Create deployment archive
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          DEPLOY_DIR="$RUNNER_TEMP/amoechat-${GITHUB_SHA}"
          ARCHIVE="$RUNNER_TEMP/amoechat-${GITHUB_SHA}.tar.gz"
          mkdir -p "$DEPLOY_DIR/.next/static" "$DEPLOY_DIR/node_modules/@img"

          cp -a .next/standalone/. "$DEPLOY_DIR/"
          cp -a .next/static/. "$DEPLOY_DIR/.next/static/"
          cp -a public "$DEPLOY_DIR/public"

          # Next standalone dapat melewatkan optional native packages milik
          # Sharp. Salin package glibc Linux x64 beserta libvips secara eksplisit.
          rm -rf "$DEPLOY_DIR/node_modules/sharp"
          cp -aL node_modules/sharp "$DEPLOY_DIR/node_modules/sharp"

          SHARP_RUNTIME_DIRS=(
            node_modules/.pnpm/@img+sharp-linux-x64@*/node_modules/@img/sharp-linux-x64
            node_modules/.pnpm/@img+sharp-libvips-linux-x64@*/node_modules/@img/sharp-libvips-linux-x64
          )

          for RUNTIME_DIR in "${SHARP_RUNTIME_DIRS[@]}"; do
            cp -aL "$RUNTIME_DIR" "$DEPLOY_DIR/node_modules/@img/"
          done

          test -f "$DEPLOY_DIR/server.js"
          test -d "$DEPLOY_DIR/public"
          test -d "$DEPLOY_DIR/.next/static"
          test -d "$DEPLOY_DIR/node_modules/@img/sharp-linux-x64"
          test -d "$DEPLOY_DIR/node_modules/@img/sharp-libvips-linux-x64"
          find "$DEPLOY_DIR/node_modules/@img/sharp-libvips-linux-x64" \
            -name 'libvips-cpp.so*' -print -quit | grep -q .

          tar -C "$DEPLOY_DIR" -czf "$ARCHIVE" .

      - name: Upload manual deployment package
        uses: actions/upload-artifact@v4
        with:
          name: amoechat-standalone-${{ github.sha }}
          path: ${{ runner.temp }}/amoechat-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7
